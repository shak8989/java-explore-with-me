
services:
  stats-server:
    build:
      context: .
      dockerfile: stats/stats-server/Dockerfile
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: stats
      SPRING_DATASOURCE_PASSWORD: stats
    depends_on:
      - stats-db

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
    ports:
      - "5433:5432"
    volumes:
      - stats-data:/var/lib/postgresql/data


  ewm-service:
    build:
      context: .
      dockerfile: ewm-main-service/Dockerfile
    ports:
      - "8080:8080"




  ewm-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - ewm-data:/var/lib/postgresql/data



volumes:
  stats-data:
  ewm-data:
