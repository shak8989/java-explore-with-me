
services:
  stats-server:
    build:
      context: .
      dockerfile: stats/stats-server/Dockerfile
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: stats
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_1_DB_PASSWORD}
    depends_on:
      - stats-db

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: ${SERVICE_1_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - stats-data:/var/lib/postgresql/data

  ewm-service:
    profiles:
      - main
    build:
      context: .
      dockerfile: ewm-main-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_2_DB_PASSWORD}
    depends_on:
      - ewm-db

  ewm-db:
    profiles:
      - main
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ${SERVICE_2_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ewm-data:/var/lib/postgresql/data

volumes:
  stats-data:
  ewm-data:
